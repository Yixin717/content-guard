# Content Guard · Nginx 站点配置
# 用法：拷到 /etc/nginx/sites-available/content-guard 并软链到 sites-enabled

# 限流：AI 接口按 IP 计。10 次/分钟的持续速率，允许 9 次突发
# → 同一 IP 连发第 11 次开始 429（每次 analyze 约 4 分钱，必须挡住刷量）
limit_req_zone $binary_remote_addr zone=ai_api:10m rate=10r/m;

server {
    listen 80;
    server_name _;          # 有域名后改成 your-domain.com

    root /var/www/content-guard;
    index index.html;

    # 静态导出：/drafts/ → /drafts/index.html
    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }

    # 长缓存：Next 的带哈希资源可以放心缓存一年
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 会调模型的四个接口：限流 + 放开超时
    location ~ ^/api/(generate|analyze|check|rewrite)$ {
        limit_req zone=ai_api burst=9 nodelay;
        limit_req_status 429;
        error_page 429 = @rate_limited;

        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 其余 /api/（历史、规则、确认）不限流：便宜、且查历史太频繁是正常行为
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    # 429 也返回 JSON，前端才能给出人话（否则 Nginx 默认吐 HTML，前端 JSON.parse 会炸）
    location @rate_limited {
        default_type application/json;
        return 429 '{"detail":"请求太频繁了：AI 接口每个 IP 每分钟 10 次，请稍后再试。"}';
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # 不暴露 8000
    location ~ ^/docs { return 404; }
}
