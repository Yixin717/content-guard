# Content Guard · Nginx 站点配置
# 用法：拷到 /etc/nginx/sites-available/content-guard 并软链到 sites-enabled

server {
    listen 80;
    server_name _;          # 有域名后改成 your-domain.com

    root /var/www/content-guard;
    index index.html;

    # 静态导出：/drafts/ → /drafts/index.html
    location / {
        try_files $uri $uri/index.html $uri.html /404.html;
    }

    # 长缓存：Next 的带哈希资源可以放心缓存一年
    location /_next/static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API 反代；LLM 调用慢，超时给到 120s
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8000/health;
        proxy_set_header Host $host;
    }

    # 不暴露 8000
    location ~ ^/docs { return 404; }
}
