[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
# 保留 typing.List/Optional 写法（项目最低支持 Python 3.9），故不启用 UP 规则
select = ["E", "F", "I", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
# FastAPI 的依赖注入就是写在默认参数里的，B008 在此场景不适用
"app/api.py" = ["B008"]
